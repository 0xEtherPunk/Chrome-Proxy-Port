<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy Port</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="terminal">
    <div class="bar">
      <div class="dots">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <span class="title">proxy-port v1.0.0</span>
    </div>

    <div class="content">
      <div class="status-card">
        <div class="status-info">
          <span class="tag ok" id="statusDot">[ACTIVE]</span>
          <span class="status-text" id="statusText">loading...</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="masterToggle">
          <span class="slider"></span>
        </label>
      </div>

      <div class="alert-box hidden" id="conflictAlert"></div>

      <div class="section-head">
        <span class="cmd-label">$ endpoint</span>
      </div>
      <div class="field-grid">
        <div class="field-col">
          <label for="schemeSelect">proto</label>
          <select id="schemeSelect" class="term-input">
            <option value="socks5">socks5</option>
            <option value="http">http</option>
            <option value="https">https</option>
            <option value="socks4">socks4</option>
          </select>
        </div>
        <div class="field-col host-col">
          <label for="hostInput">host</label>
          <input type="text" id="hostInput" class="term-input" placeholder="127.0.0.1" spellcheck="false">
        </div>
        <div class="field-col port-col">
          <label for="portInput">port</label>
          <input type="number" id="portInput" class="term-input" placeholder="60009" min="1" max="65535">
        </div>
      </div>

      <div class="section-head">
        <span class="cmd-label">$ routing-mode</span>
      </div>
      <div class="segmented-control">
        <button type="button" class="segment-btn active" data-mode="global">
          <span class="seg-title">GLOBAL</span>
          <span class="seg-desc">all traffic</span>
        </button>
        <button type="button" class="segment-btn" data-mode="selective">
          <span class="seg-title">SELECTIVE</span>
          <span class="seg-desc">only rules</span>
        </button>
        <button type="button" class="segment-btn" data-mode="exclude">
          <span class="seg-title">EXCLUDE</span>
          <span class="seg-desc">bypass rules</span>
        </button>
      </div>

      <div class="section-head rules-head">
        <div class="cmd-with-count">
          <span class="cmd-label">$ rules</span>
          <span class="count-badge" id="ruleCount">0</span>
        </div>
        <div class="view-toggle">
          <button type="button" class="view-btn active" id="listViewBtn">list</button>
          <button type="button" class="view-btn" id="bulkViewBtn">bulk</button>
        </div>
      </div>

      <div class="quick-add-bar hidden" id="currentTabContainer">
        <button type="button" class="btn btn-tab" id="addCurrentTabBtn">
          <span class="plus-symbol">+</span> tab: <span class="tab-host" id="currentTabHost">...</span>
        </button>
      </div>

      <div class="input-row">
        <input type="text" id="newRuleInput" class="term-input" placeholder="*.domain.com or domain.com" spellcheck="false">
        <button type="button" class="btn btn-action" id="addRuleBtn">+ add</button>
      </div>

      <div class="rules-list-container" id="rulesListView">
        <div class="rules-list" id="rulesList"></div>
      </div>

      <div class="rules-bulk-container hidden" id="rulesBulkView">
        <textarea id="bulkRulesArea" class="term-input" rows="5" placeholder="One domain per line" spellcheck="false"></textarea>
        <button type="button" class="btn btn-block" id="saveBulkBtn">save bulk rules</button>
      </div>

      <div class="accordion-head" id="testerToggle">
        <span class="cmd-label">$ eval-target</span>
        <span class="accordion-arrow" id="testerArrow">&#9662;</span>
      </div>
      <div class="accordion-content hidden" id="testerBody">
        <input type="text" id="testerInput" class="term-input" placeholder="test host or url..." spellcheck="false">
        <div class="tester-result" id="testerResult">ready</div>
      </div>

      <div class="accordion-head" id="optionsToggle">
        <span class="cmd-label">$ options</span>
        <span class="accordion-arrow" id="optionsArrow">&#9662;</span>
      </div>
      <div class="accordion-content hidden" id="optionsBody">
        <div class="opt-row">
          <span class="opt-label">bypass local (127.0.0.1, LAN)</span>
          <label class="switch">
            <input type="checkbox" id="bypassLocalCheck">
            <span class="slider"></span>
          </label>
        </div>
        <div class="opt-row">
          <span class="opt-label">fallback DIRECT on failure</span>
          <label class="switch">
            <input type="checkbox" id="fallbackDirectCheck">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="footer">
        <div class="toast hidden" id="toastMessage"></div>
        <div class="footer-btns">
          <button type="button" class="btn" id="reapplyBtn">$ sync</button>
          <button type="button" class="btn" id="openTabBtn">$ open-tab</button>
        </div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
